<!DOCTYPE html>
<html lang="en-GB" data-theme="light">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff">
<script src="js/theme.js"></script>
<title>Race Nutrition</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="assets/icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Race Nutrition">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="page">
<button type="button" class="lg-button lg-button--in-page lg-surface" id="openSettings" aria-label="Settings">
  <span class="lg-surface__lens" aria-hidden="true"></span>
  <span class="lg-surface__frost" aria-hidden="true"></span>
  <span class="lg-button__icon"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M421-80q-14 0-25-9t-13-23l-15-94q-19-7-40-19t-37-25l-86 40q-14 6-28 1.5T155-226L97-330q-8-13-4.5-27t15.5-23l80-59q-2-9-2.5-20.5T185-480q0-9 .5-20.5T188-521l-80-59q-12-9-15.5-23t4.5-27l58-104q8-13 22-17.5t28 1.5l86 40q16-13 37-25t40-18l15-95q2-14 13-23t25-9h118q14 0 25 9t13 23l15 94q19 7 40.5 18.5T669-710l86-40q14-6 27.5-1.5T804-734l59 104q8 13 4.5 27.5T852-580l-80 57q2 10 2.5 21.5t.5 21.5q0 10-.5 21t-2.5 21l80 58q12 8 15.5 22.5T863-330l-58 104q-8 13-22 17.5t-28-1.5l-86-40q-16 13-36.5 25.5T592-206l-15 94q-2 14-13 23t-25 9H421Zm59-270q54 0 92-38t38-92q0-54-38-92t-92-38q-54 0-92 38t-38 92q0 54 38 92t92 38Z"/></svg></span>
</button>
<!-- One section per nav tab, in the same order as the tabs (see VIEWS in main.js) -->
<main class="views">
  <section class="view view--has-button" id="view-page1">
    <h1 tabindex="-1">Page 1</h1>
  </section>

  <section class="view view--has-button" id="view-page2" hidden>
    <h1 tabindex="-1">Page 2</h1>
  </section>

  <section class="view view--has-button" id="view-page3" hidden>
    <h1 tabindex="-1">Page 3</h1>
  </section>
</main>
</div>

<!-- Settings: a full-screen pop-up over everything, including the nav. The
     close button sits exactly where the settings button was. -->
<dialog class="settings-sheet" id="settingsDialog" aria-labelledby="settingsTitle">
  <div class="settings-sheet__content view--has-button">
    <h1 id="settingsTitle" tabindex="-1" autofocus>Settings</h1>
    <button type="button" class="lg-button lg-surface" id="closeSettings" aria-label="Close settings">
      <span class="lg-surface__lens" aria-hidden="true"></span>
      <span class="lg-surface__frost" aria-hidden="true"></span>
      <span class="lg-button__icon"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M480-438 270-228q-9 9-21 9t-21-9q-9-9-9-21t9-21l210-210-210-210q-9-9-9-21t9-21q9-9 21-9t21 9l210 210 210-210q9-9 21-9t21 9q9 9 9 21t-9 21L522-480l210 210q9 9 9 21t-9 21q-9 9-21 9t-21-9L480-438Z"/></svg></span>
    </button>

  </div>
</dialog>

<!-- Liquid glass distortion for the tab bar: soft noise (feTurbulence) bends
     the blurred background (feDisplacementMap), like looking through uneven glass -->
<svg class="lg-filters" aria-hidden="true" focusable="false">
  <filter id="lg-distortion" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="7" result="noise"/>
    <feGaussianBlur in="noise" stdDeviation="2" result="softNoise"/>
    <feDisplacementMap in="SourceGraphic" in2="softNoise" scale="30" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<!-- Tab bar icons: Google Material Symbols Rounded (Apache 2.0). Placeholders
     copied from the triathlon app (bag, checklist, calendar); swap for this app's. -->
<nav class="lg-nav lg-surface" aria-label="Main">
  <span class="lg-surface__lens" aria-hidden="true"></span>
  <span class="lg-surface__frost" aria-hidden="true"></span>
  <div class="lg-nav__items">
    <span class="lg-nav__indicator" aria-hidden="true"></span>
    <button type="button" class="lg-nav__item is-active" aria-current="page">
      <span class="lg-nav__icon"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M260-120q-24.75 0-42.37-17.63Q200-155.25 200-180v-480q0-24.75 17.63-42.38Q235.25-720 260-720h105v-100q0-24.75 17.63-42.38Q400.25-880 425-880h110q24.75 0 42.38 17.62Q595-844.75 595-820v100h105q24.75 0 42.38 17.62Q760-684.75 760-660v480q0 24.75-17.62 42.37Q724.75-120 700-120q0 17-11.5 28.5T660-80q-17 0-28.5-11.5T620-120H340q0 17-11.5 28.5T300-80q-17 0-28.5-11.5T260-120Zm134.82-480q-12.82 0-21.32 8.62-8.5 8.63-8.5 21.38v300q0 12.75 8.68 21.37 8.67 8.63 21.5 8.63 12.82 0 21.32-8.63 8.5-8.62 8.5-21.37v-300q0-12.75-8.68-21.38-8.67-8.62-21.5-8.62Zm170 0q-12.82 0-21.32 8.62-8.5 8.63-8.5 21.38v300q0 12.75 8.68 21.37 8.67 8.63 21.5 8.63 12.82 0 21.32-8.63 8.5-8.62 8.5-21.37v-300q0-12.75-8.68-21.38-8.67-8.62-21.5-8.62ZM425-720h110v-100H425v100Z"/></svg></span>
      <span class="lg-nav__label">Page 1</span>
    </button>
    <button type="button" class="lg-nav__item">
      <span class="lg-nav__icon"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="m222-299 158-158q9-9 21-8.5t21.39 9.5q8.61 9 8.61 21t-9 21L243-235q-9 9-21 9t-21-9L101-335q-9-9-9-21t9-21q9-9 21-8.5t21 8.5l79 78Zm0-320 158-158q9-9 21-8.5t21.39 9.5q8.61 9 8.61 21t-9 21L243-555q-9 9-21 9t-21-9L101-655q-9-9-9-21t9-21q9-9 21-8.5t21 8.5l79 78Zm328 329q-12.75 0-21.37-8.68-8.63-8.67-8.63-21.5 0-12.82 8.63-21.32 8.62-8.5 21.37-8.5h300q12.75 0 21.38 8.68 8.62 8.67 8.62 21.5 0 12.82-8.62 21.32-8.63 8.5-21.38 8.5H550Zm0-320q-12.75 0-21.37-8.68-8.63-8.67-8.63-21.5 0-12.82 8.63-21.32 8.62-8.5 21.37-8.5h300q12.75 0 21.38 8.68 8.62 8.67 8.62 21.5 0 12.82-8.62 21.32-8.63 8.5-21.38 8.5H550Z"/></svg></span>
      <span class="lg-nav__label">Page 2</span>
    </button>
    <button type="button" class="lg-nav__item">
      <span class="lg-nav__icon"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M596.82-220Q556-220 528-248.18q-28-28.19-28-69Q500-358 528.18-386q28.19-28 69-28Q638-414 666-385.82q28 28.19 28 69Q694-276 665.82-248q-28.19 28-69 28ZM180-80q-24 0-42-18t-18-42v-620q0-24 18-42t42-18h65v-28q0-13.6 9.2-22.8 9.2-9.2 22.8-9.2 14.02 0 23.51 9.2Q310-861.6 310-848v28h340v-28q0-13.6 9.2-22.8 9.2-9.2 22.8-9.2 14.03 0 23.51 9.2Q715-861.6 715-848v28h65q24 0 42 18t18 42v620q0 24-18 42t-42 18H180Zm0-60h600v-430H180v430Z"/></svg></span>
      <span class="lg-nav__label">Page 3</span>
    </button>
  </div>
</nav>

<script src="js/main.js"></script>
<script src="js/liquid-glass-nav.js"></script>
</body>
</html>
